<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Withdraw BTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-surface: #f7f9fa;
      --border-color: #e6e8ea;
      --text-primary: #0f1419;
      --text-secondary: #536471;
      --text-muted: #8b98a5;
      --brand-yellow: #f0b90b;
      --brand-yellow-hover: #e0ac07;
      --danger: #f6465d;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-main);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--bg-main);
    }

    /* Header Bar */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .header-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--text-primary);
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
    }

    .header-placeholder {
      width: 24px;
    }

    /* Main Scroll Area */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Asset Header Card */
    .asset-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      border: 1px solid var(--border-color);
    }

    .asset-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .asset-icon {
      width: 36px;
      height: 36px;
      background-color: #f7931a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
    }

    .asset-symbol {
      font-size: 15px;
      font-weight: 600;
    }

    .asset-name {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .asset-balance {
      text-align: right;
    }

    .balance-val {
      font-size: 15px;
      font-weight: 600;
    }

    .balance-lbl {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }

    .input-box {
      display: flex;
      align-items: center;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 14px;
      height: 52px;
      transition: border-color 0.15s ease;
    }

    .input-box:focus-within {
      border-color: var(--brand-yellow);
    }

    /* Red outline state matching the screenshot */
    .input-box.input-error {
      border-color: var(--danger) !important;
    }

    .input-field {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      width: 100%;
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .inline-btn {
      background: none;
      border: none;
      color: var(--brand-yellow);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .clear-btn {
      display: none;
      background: var(--text-muted);
      border: none;
      color: #ffffff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
    }

    .read-only-select {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 14px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      color: var(--text-primary);
    }

    /* Inline Text Error Matching Screenshot */
    .inline-error-text {
      display: none;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Info Block */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .info-label {
      color: var(--text-secondary);
    }

    .info-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Bottom Action Button */
    .app-footer {
      padding: 16px;
      background-color: var(--bg-main);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background-color: var(--brand-yellow);
      color: #000000;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-submit:active {
      background-color: var(--brand-yellow-hover);
    }
  </style>
</head>
<body>

<div class="app-viewport">
  <header class="app-header">
    <button class="header-btn" aria-label="Go Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1 class="header-title">Withdraw BTC</h1>
    <div class="header-placeholder"></div>
  </header>

  <main class="app-content">
    
    <div class="asset-card">
      <div class="asset-info">
        <div class="asset-icon">₿</div>
        <div>
          <div class="asset-symbol">BTC</div>
          <div class="asset-name">Bitcoin</div>
        </div>
      </div>
      <div class="asset-balance">
        <div class="balance-val">€8.64</div>
        <div class="balance-lbl">Available</div>
      </div>
    </div>

    <!-- Address Field -->
    <div class="form-group">
      <label class="field-label" for="address">Address</label>
      <div class="input-box">
        <input 
          type="text" 
          id="address" 
          class="input-field" 
          placeholder="Long press or tap to paste"
          autocomplete="off"
          spellcheck="false"
        >
        <button type="button" class="inline-btn" onclick="pasteAddress()">Paste</button>
      </div>
    </div>

    <!-- Network Field -->
    <div class="form-group">
      <label class="field-label">Network</label>
      <div class="read-only-select">
        <span>Bitcoin (BTC)</span>
        <span style="color: var(--text-secondary); font-size: 13px;">Native SegWit</span>
      </div>
    </div>

    <!-- Amount Field -->
    <div class="form-group">
      <div class="field-label">
        <span>Amount</span>
        <span>Available: €8.64</span>
      </div>
      <div class="input-box" id="amount-box">
        <input 
          type="number" 
          id="amount" 
          class="input-field" 
          placeholder="0.00" 
          step="0.01" 
          inputmode="decimal"
        >
        <button type="button" id="clear-amount" class="clear-btn" onclick="clearAmountInput()">✕</button>
        <span style="color: var(--text-primary); font-weight: 500; font-size: 14px; margin-right: 4px;">EUR</span>
        <button type="button" class="inline-btn" onclick="setMaxAmount()">Max</button>
      </div>
      <!-- Error Message placed directly below input -->
      <div id="inline-error" class="inline-error-text">
        Your balance is insufficient to cover the withdrawal amount and fees
      </div>
    </div>

    <!-- Info List with static Receive Amount -->
    <div class="info-list">
   
      <div class="info-row">
        <span class="info-label">Network Fee</span>
        <span class="info-value">€4.28</span>
      </div>
      <div class="info-row">
        <span class="info-label">Minimum Withdrawal</span>
        <span class="info-value">€6.00</span>
      </div>
    </div>
       <div class="info-row">
        <span class="info-label">Receive Amount</span>
        <span class="info-value">0.00 EUR</span>
      </div>

  </main>

  <footer class="app-footer">
    <button type="button" class="btn-submit" onclick="submitWithdrawal()">Withdraw</button>
  </footer>
</div>

<script>
  const USER_BALANCE = 6.24;

  async function pasteAddress() {
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('address').value = text.trim();
        }
      } else {
        alert("Clipboard access restricted. Please paste manually.");
      }
    } catch (err) {
      alert("Unable to read clipboard automatically.");
    }
  }

  function setMaxAmount() {
    const amountInput = document.getElementById('amount');
    amountInput.value = USER_BALANCE.toFixed(2);
    validateAmount();
  }

  function clearAmountInput() {
    const amountInput = document.getElementById('amount');
    amountInput.value = '';
    validateAmount();
  }

  function validateAmount() {
    const amountInput = document.getElementById('amount');
    const amountBox = document.getElementById('amount-box');
    const inlineError = document.getElementById('inline-error');
    const clearBtn = document.getElementById('clear-amount');
    const val = parseFloat(amountInput.value);

    // Toggle clear button (x)
    if (amountInput.value.length > 0) {
      clearBtn.style.display = 'flex';
    } else {
      clearBtn.style.display = 'none';
    }

    // Trigger precise error if amount exceeds current balance
    if (!isNaN(val) && val > USER_BALANCE) {
      amountBox.classList.add('input-error');
      inlineError.style.display = 'block';
      return false;
    } else {
      amountBox.classList.remove('input-error');
      inlineError.style.display = 'none';
      return true;
    }
  }

  function submitWithdrawal() {
    const address = document.getElementById('address').value.trim();
    const isAmountValid = validateAmount();
    const amount = parseFloat(document.getElementById('amount').value);

    if (!address) {
      alert("Please enter a valid BTC destination address.");
      return;
    }

    if (isNaN(amount) || amount <= 0) {
      alert("Please enter an amount to withdraw.");
      return;
    }

    if (isAmountValid) {
      alert("Withdrawal submitted successfully.");
    }
  }

  document.getElementById('amount').addEventListener('input', validateAmount);
</script>

</body>
</html>
